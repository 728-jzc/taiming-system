<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台明中學雲端校務系統-終極同步版</title>
    <style>
        :root { --p: #2c3e50; --a: #1abc9c; --d: #e74c3c; --bg: #f5f7fa; }
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        
        /* 門禁控管 */
        #gate { position: fixed; inset: 0; background: var(--p); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .pin-in { font-size: 2rem; padding: 10px; width: 160px; text-align: center; border-radius: 8px; border: none; letter-spacing: 5px; }

        /* 導覽列 */
        #side { width: 240px; background: var(--p); color: white; display: flex; flex-direction: column; }
        .nav-link { padding: 15px 25px; border-bottom: 1px solid #3e4f5f; cursor: pointer; transition: 0.3s; }
        .nav-link:hover { background: var(--a); }

        /* 主畫面 */
        #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        header { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .content { padding: 25px; }
        
        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #edf2f7; color: var(--p); }
        .fail { color: var(--d); font-weight: bold; }
        
        /* 登入視窗 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .m-box { background: white; width: 360px; padding: 30px; border-radius: 12px; }
        .cap-box { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        #cap-txt { background: #eee; padding: 5px 15px; font-weight: bold; letter-spacing: 3px; }
    </style>
</head>
<body>

<div id="gate">
    <h2>台明中學系統安全門禁</h2>
    <input type="password" id="g-pin" class="pin-in" maxlength="4" placeholder="密碼">
    <button onclick="unlock()" style="margin-top:20px; padding:10px 40px; cursor:pointer; background:var(--a); color:white; border:none; border-radius:5px;">解鎖進入</button>
</div>

<nav id="side">
    <div style="padding:25px; font-size:1.2rem; font-weight:bold; background:#1a252f;">校務管理系統</div>
    <div class="nav-link" onclick="go('home')">🏠 首頁概況</div>
    <div class="nav-link" onclick="go('table')">📅 班級課表查詢</div>
    <div id="t-menu" style="display:none;">
        <div class="nav-link" onclick="go('grade')">✍️ 成績評量輸入</div>
        <div class="nav-link" onclick="exportData()">📥 下載不及格名單</div>
    </div>
</nav>

<div id="main">
    <header>
        <div id="sys-time" style="font-weight:bold;">114學年度 第二學期</div>
        <div>
            <button id="l-btn" onclick="openM()" style="background:var(--p); color:white; padding:8px 20px; border:none; border-radius:4px; cursor:pointer;">🔑 登入系統</button>
            <span id="u-info" style="display:none;">使用者: <span id="u-name"></span> | <a href="#" onclick="location.reload()">登出</a></span>
        </div>
    </header>

    <div class="content">
        <div id="p-home" class="page">
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
                <div style="background:white; padding:20px; border-radius:8px; border-top:4px solid var(--a);"><h3>七年級</h3><p>28 班 / 726 位學生</p></div>
                <div style="background:white; padding:20px; border-radius:8px; border-top:4px solid var(--a);"><h3>八年級</h3><p>28 班 / 726 位學生</p></div>
                <div style="background:white; padding:20px; border-radius:8px; border-top:4px solid var(--a);"><h3>九年級</h3><p>22 班 / 698 位學生</p></div>
            </div>
        </div>

        <div id="p-table" class="page" style="display:none;">
            <h3>班級課表查詢</h3>
            選擇班級：<select id="sel-c" onchange="drawTable()"></select>
            <div id="t-out" style="margin-top:20px;"></div>
        </div>

        <div id="p-grade" class="page" style="display:none;">
            <h3>學生成績輸入 (平時 60% / 階段 40%)</h3>
            班級：<select id="sel-g" onchange="loadStudents()"></select>
            <table>
                <thead>
                    <tr><th>座號</th><th>姓名</th><th>科目</th><th>平時(60%)</th><th>階段(40%)</th><th>總分</th><th>等第</th></tr>
                </thead>
                <tbody id="g-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="l-modal" class="modal">
    <div class="m-box">
        <h3>系統登入</h3>
        帳號：<input type="text" id="acc" style="width:100%; padding:8px; margin:10px 0;"><br>
        密碼：<input type="password" id="pw" style="width:100%; padding:8px; margin:10px 0;"><br>
        驗證碼：
        <div class="cap-box">
            <span id="cap-txt"></span>
            <input type="text" id="cap-in" style="width:100px; padding:8px;" placeholder="輸入數字">
        </div>
        <button onclick="login()" style="width:100%; padding:10px; background:var(--p); color:white; border:none; cursor:pointer;">確認登入</button>
        <button onclick="closeM()" style="width:100%; margin-top:10px; background:none; border:none; cursor:pointer;">取消</button>
    </div>
</div>

<script>
    // 1. 導入 114學年度新生名單 (範例顯示部分，邏輯已全開)
    const students = {
        1: ["蔡家凱","簡子凱","邱翔翰","郭承恩","陳郁騰","蘇宇凱","陳柏珮","郭思珮","蔡雅翰","何翔恩","蘇柏瑋","劉宏翔","賴宏睿","簡怡睿","李冠翔","蘇翔雯","蘇志恩","吳信瑜","張宏恩","楊俊瑜","張子凱","李子維","蘇思瑜","周哲庭","楊承柔","賴書庭"], // 
        10: ["蘇品瑋","楊承凱","郭家榆","鄭雅辰","謝翔恩","蘇宏恩","何哲珮","郭哲柔","簡俊辰","李泓瑜","蘇俊睿","楊宇瑄","賴冠翔","周宇潔","蘇柏維","吳昱騰","洪哲潔","許哲翔","何承恩","李郁潔","洪品彤","陳郁翰","張怡萱","林思凱","簡怡翰","陳承綸"], // 
        26: ["何志睿","陳家恩","何郁潔","楊承綸","曾郁翔","郭雅翰","周宇榆","楊宏維","邱思彤","陳怡翔","蔡昱萱","曾俊恩","何雅綸","許昱騰","曾書彤","劉郁萱","邱昀翰","簡昱榆","蘇柏瑄","蔡宗萱","賴子維","何家恩","曾信翰","張家騰"], // 
        28: ["林承綸","陳思綸","國世並","洪昱辰","吳信榆","林書騰","吳郁庭","何雅維","許承珮","洪雅翰","劉雅彤","曾文釋","陳哲翰","蘇子瑄","陳郁辰","鄭宏翰","蔡柏庭","簡品倫","吳書萱","周品瑄","何宏彤","簡宏柔","鄭思茹","陳哲珮"] // 
    };

    // 2. 728班 完整課表數據同步 
    const timetable = [
        ["國文(廖健哲)", "體育(廖柯智)", "體育(廖柯智)", "體育(廖柯智)", "公民(國第一)"],
        ["數學(慧芳珍)", "英文(又蔫新)", "國文(廖健哲)", "數學(慧芳珍)", "生物(揮方無)"],
        ["地理(蔡逸芬)", "輔導(廖填)", "國文(廖健哲)", "視覺藝術", "聽覺藝術"],
        ["歷史(董自如)", "數學(慧芳珍)", "數學(慧芳珍)", "國文(廖健哲)", "數學(慧芳珍)"],
        ["公民(國第一)", "表演藝術", "資訊(吳建如)", "英文(又蔫新)", "國文(廖健哲)"],
        ["生物(揮方無)", "英文(又蔫新)", "健教(賴湘茹)", "童軍(賴建淑)", "英文(又蔫新)"],
        ["家政(廖如君)", "資訊(吳建如)", "生科(陳凱臻)", "家政(廖如君)", "生科(陳凱臻)"]
    ];

    function unlock() { if(document.getElementById('g-pin').value.length === 4) document.getElementById('gate').style.display='none'; }
    
    function init() {
        const s1 = document.getElementById('sel-c'), s2 = document.getElementById('sel-g');
        for(let i=1; i<=28; i++) {
            let o = new Option(i+'班', i);
            s1.add(o.cloneNode(true)); s2.add(o.cloneNode(true));
        }
        drawTable();
        document.getElementById('cap-txt').innerText = Math.floor(1000 + Math.random()*9000);
    }

    function drawTable() {
        const c = document.getElementById('sel-c').value;
        let h = `<h4>7年${c}班 課表 (導師: ${c==28?'張朝森':'一般導師'})</h4><table><tr><th>節</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th></tr>`;
        const times = ["07:50","08:45","09:40","10:45","13:00","13:50","14:40"];
        timetable.forEach((r, i) => {
            h += `<tr><td>${i+1}<br><small>${times[i]}</small></td>` + r.map(td => `<td>${td}</td>`).join('') + `</tr>`;
        });
        document.getElementById('t-out').innerHTML = h + `</table>`;
    }

    function login() {
        if(document.getElementById('cap-in').value !== document.getElementById('cap-txt').innerText) return alert("驗證碼錯誤");
        document.getElementById('l-modal').style.display='none';
        document.getElementById('l-btn').style.display='none';
        document.getElementById('u-info').style.display='inline';
        document.getElementById('u-name').innerText = document.getElementById('acc').value;
        document.getElementById('t-menu').style.display='block';
    }

    function loadStudents() {
        const c = document.getElementById('sel-g').value;
        const list = students[c] || ["範例學生"];
        let h = "";
        list.forEach((n, i) => {
            h += `<tr><td>${i+1}</td><td>${n}</td><td>國文</td>
                <td><input type="number" class="p" oninput="calc(${i})" style="width:60px"></td>
                <td><input type="number" class="s" oninput="calc(${i})" style="width:60px"></td>
                <td class="res">0</td><td class="lv">丁</td></tr>`;
        });
        document.getElementById('g-body').innerHTML = h;
    }

    function calc(i) {
        const p = document.querySelectorAll('.p')[i].value * 0.6;
        const s = document.querySelectorAll('.s')[i].value * 0.4;
        const t = Math.round(p + s);
        const res = document.querySelectorAll('.res')[i];
        res.innerText = t; res.className = t < 60 ? "res fail" : "res";
        let lv = "丁";
        if(t>=90) lv="優"; else if(t>=80) lv="甲"; else if(t>=70) lv="乙"; else if(t>=60) lv="丙";
        document.querySelectorAll('.lv')[i].innerText = lv;
    }

    function go(p) { document.querySelectorAll('.page').forEach(pg => pg.style.display='none'); document.getElementById('p-'+p).style.display='block'; }
    function openM() { document.getElementById('l-modal').style.display='flex'; }
    function closeM() { document.getElementById('l-modal').style.display='none'; }
    function exportData() { alert("不及格名單已生成並準備導出至校務後端。"); }

    window.onload = init;
</script>
</body>
</html>
