<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>TM-Cloud OS | 億萬級旗艦校務系統</title>
    <style>
        /* [核心視覺引擎] */
        :root {
            --primary: #020617; --accent: #38bdf8; --teacher-gold: #fbbf24;
            --student-mint: #34d399; --danger: #f43f5e; --text: #f8fafc;
        }
        body { margin: 0; background: var(--primary); color: var(--text); font-family: 'Inter', system-ui; display: flex; height: 100vh; overflow: hidden; }

        /* [原始條件 1-4：門禁系統] */
        #gatekeeper {
            position: fixed; inset: 0; z-index: 999999; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .pin-box { 
            background: transparent; border: 2px solid var(--accent); color: var(--accent);
            font-size: 5rem; width: 300px; text-align: center; border-radius: 20px; outline: none;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); letter-spacing: 15px;
        }

        /* [側邊功能大腦] */
        aside { width: 320px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .nav-link { padding: 20px 30px; border: none; background: none; color: #94a3b8; text-align: left; cursor: pointer; transition: 0.3s; font-size: 15px; display: flex; align-items: center; gap: 15px; }
        .nav-link:hover, .nav-link.active { color: var(--accent); background: rgba(56, 189, 248, 0.05); border-left: 4px solid var(--accent); }

        /* [視窗管理系統] */
        main { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at top, #0f172a, #020617); }
        .top-nav { height: 80px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; }
        .view-content { padding: 40px; overflow-y: auto; flex: 1; }

        /* [科目與課表渲染] */
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid #334155; border-radius: 24px; padding: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 18px; font-weight: 600; border: 1px solid #1e293b; }
        td { padding: 15px; text-align: center; border: 1px solid #1e293b; }
        .teacher-info { font-size: 11px; color: #64748b; display: block; margin-top: 5px; }
        .score-fail { color: var(--danger); font-weight: bold; }

        /* [驗證碼模組] */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
        .auth-panel { background: #0f172a; width: 450px; padding: 50px; border-radius: 30px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div id="gatekeeper">
        <h1 style="letter-spacing: 10px;">TM-OS CORE</h1>
        <p style="color: var(--accent)">請輸入管理 PIN 以存取全校科目數據</p>
        <input type="password" id="pin-in" class="pin-box" maxlength="4">
        <button onclick="unlock()" style="margin-top:40px; background:var(--accent); color:black; border:none; padding:15px 50px; border-radius:10px; font-weight:bold; cursor:pointer;">執行系統初始化</button>
    </div>

    <aside>
        <div style="padding: 40px 30px; font-size: 24px; font-weight: 900; color: var(--accent);">TM-INFINITY</div>
        <div id="menu">
            <button class="nav-link active" onclick="nav('dash')">📊 系統運行狀態</button>
            <button class="nav-link" onclick="nav('tt')">📅 728 班完整課表</button>
            <div id="teacher-zone" style="display:none;">
                <div style="padding:15px 30px; font-size:11px; color:#475569;">教師管理核心</div>
                <button class="nav-link" onclick="nav('input')">✍️ 各科成績輸入系統</button>
            </div>
            <div id="student-zone" style="display:none;">
                <div style="padding:15px 30px; font-size:11px; color:#475569;">學生查詢中心</div>
                <button class="nav-link" onclick="nav('report')">📝 個人科目成績單</button>
            </div>
        </div>
    </aside>

    <main>
        <header class="top-nav">
            <div id="sys-clock" style="font-family: monospace; color: var(--accent);"></div>
            <div>
                <button id="login-btn" onclick="openAuth()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:8px 25px; border-radius:8px; cursor:pointer;">身分授權</button>
                <span id="user-info" style="display:none; color:var(--student-mint); font-weight:bold;"></span>
            </div>
        </header>

        <div class="view-content">
            <div id="view-tt" class="view-sec" style="display:none;">
                <div class="glass-card">
                    <h3>7年28班 精確數位課表 (導師：張朝森)</h3>
                    <table>
                        <thead>
                            <tr><th>時間節次</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>
                        </thead>
                        <tbody id="tt-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="view-input" class="view-sec" style="display:none;">
                <div class="glass-card">
                    <h3>科目成績加權引擎</h3>
                    <div style="display:flex; gap:20px; margin-bottom:20px;">
                        選擇班級：<select id="sel-cls" onchange="renderStudents()"></select>
                        選擇科目：<select id="sel-sub">
                            <option>國文</option><option>數學</option><option>英文</option><option>生物</option>
                            <option>體育</option><option>地理</option><option>歷史</option><option>公民</option>
                        </select>
                    </div>
                    <table>
                        <thead><tr><th>座號</th><th>姓名</th><th>平時(60%)</th><th>階段(40%)</th><th>總分</th><th>等第</th></tr></thead>
                        <tbody id="student-list"></tbody>
                    </table>
                </div>
            </div>

            <div id="view-dash" class="view-sec">
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:30px;">
                    <div class="glass-card"><h4>全校班級</h4><h2>28 班</h2></div>
                    <div class="glass-card"><h4>監控科目</h4><h2>15 門學科</h2></div>
                    <div class="glass-card"><h4>系統列數</h4><h2 style="color:var(--accent)">99,999,999+</h2></div>
                </div>
            </div>
        </div>
    </main>

    <div id="auth-modal" class="modal">
        <div class="auth-panel">
            <h2 style="text-align:center; color:var(--accent);">身分安全授權</h2>
            <select id="role-sel" style="width:100%; padding:15px; margin:15px 0;">
                <option value="stu">學生 (姓名登入)</option>
                <option value="tea">教師 (Jason1010907)</option>
            </select>
            <input type="text" id="acc" placeholder="請輸入姓名/帳號" style="width:100%; padding:15px; margin-bottom:15px;">
            <input type="password" id="pw" placeholder="密碼" style="width:100%; padding:15px; margin-bottom:15px;">
            <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px;">
                <span id="captcha" style="font-size:30px; font-weight:bold; color:var(--teacher-gold); letter-spacing:8px;"></span>
                <input type="text" id="cap-in" placeholder="驗證碼" style="flex:1; padding:12px;">
            </div>
            <button onclick="login()" style="width:100%; background:var(--accent); color:black; padding:15px; border:none; font-weight:900; border-radius:10px; cursor:pointer;">執行系統登入</button>
            <button onclick="closeAuth()" style="width:100%; background:none; border:none; color:#64748b; margin-top:15px; cursor:pointer;">取消</button>
        </div>
    </div>

<script>
    /* [無限規模邏輯引擎] */
    const DB = {
        // [Condition 26] 名冊
        students: {
            "701": ["蔡家凱","簡子凱","邱翔翰","郭承恩","陳郁騰","蘇宇凱","陳柏珮","郭思珮","蔡雅翰","何翔恩","蘇柏瑋","劉宏翔","賴宏睿","簡怡睿","李冠翔","蘇翔雯","蘇志恩","吳信瑜","張宏恩","楊俊瑜","張子凱","李子維","蘇思瑜","周哲庭","楊承柔","賴書庭"],
            "728": ["林承綸","陳思綸","國世並","洪昱辰","吳信榆","林書騰","吳郁庭","何雅維","許承珮","洪雅翰","劉雅彤","曾文釋","陳哲翰","蘇子瑄","陳郁辰","鄭宏翰","蔡柏庭","簡品倫","吳書萱","周品瑄","何宏彤","簡宏柔","鄭思茹","陳哲珮"]
        },
        // [Condition 28, 34] 完整科目課表
        timetable: [
            ["07:50", "國文<span class='teacher-info'>廖健哲</span>", "體育<span class='teacher-info'>廖柯智</span>", "生物<span class='teacher-info'>揮方無</span>", "體育<span class='teacher-info'>廖柯智</span>", "公民<span class='teacher-info'>國第一</span>"],
            ["08:35", "下課 8:35~8:45", "break"],
            ["08:45", "數學<span class='teacher-info'>慧芳珍</span>", "英文<span class='teacher-info'>又蔫新</span>", "國文<span class='teacher-info'>廖健哲</span>", "數學<span class='teacher-info'>慧芳珍</span>", "生物<span class='teacher-info'>揮方無</span>"],
            ["09:30", "下課 9:30~9:40", "break"],
            ["09:40", "地理<span class='teacher-info'>蔡逸芬</span>", "輔導<span class='teacher-info'>廖填</span>", "國文<span class='teacher-info'>廖健哲</span>", "視覺藝術", "聽覺藝術"],
            ["11:50", "午休 11:50~12:50", "break"],
            ["13:00", "公民<span class='teacher-info'>國第一</span>", "表演藝術", "資訊<span class='teacher-info'>吳建如</span>", "英文<span class='teacher-info'>又蔫新</span>", "國文<span class='teacher-info'>廖健哲</span>"]
        ]
    };

    function unlock() {
        if(document.getElementById('pin-in').value === "1234") {
            document.getElementById('gatekeeper').style.display = 'none';
            initOS();
        } else { alert("PIN 碼錯誤"); }
    }

    function initOS() {
        setInterval(() => { document.getElementById('sys-clock').innerText = new Date().toLocaleString(); }, 1000);
        const sel = document.getElementById('sel-cls');
        for(let i=1; i<=28; i++) {
            let n = `7${i.toString().padStart(2, '0')}`;
            sel.add(new Option(`${n} 班`, n));
        }
        renderTable();
        genCaptcha();
    }

    function renderTable() {
        const body = document.getElementById('tt-body');
        DB.timetable.forEach(r => {
            const tr = document.createElement('tr');
            if(r[2] === "break") tr.innerHTML = `<td colspan="6" style="background:rgba(255,255,255,0.03); color:#64748b;">${r[0]} | ${r[1]}</td>`;
            else tr.innerHTML = `<td><b>${r[0]}</b></td>` + r.slice(1).map(c => `<td>${c}</td>`).join('');
            body.appendChild(tr);
        });
    }

    function openAuth() { document.getElementById('auth-modal').style.display='flex'; genCaptcha(); }
    function closeAuth() { document.getElementById('auth-modal').style.display='none'; }
    function genCaptcha() { document.getElementById('captcha').innerText = Math.floor(1000 + Math.random()*9000); }

    function login() {
        const role = document.getElementById('role-sel').value;
        const acc = document.getElementById('acc').value;
        const cap = document.getElementById('cap-in').value;
        if(cap !== document.getElementById('captcha').innerText) { alert("驗證碼錯誤"); return; }

        if(role === 'tea') {
            if(acc === "Jason1010907") { success('teacher', 'Jason 老師'); }
            else alert("教師帳號錯誤");
        } else {
            let found = false;
            for(let c in DB.students) if(DB.students[c].includes(acc)) found = true;
            if(found) success('student', acc);
            else alert("查無此姓名");
        }
    }

    function success(role, name) {
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-info').innerText = name;
        document.getElementById('teacher-zone').style.display = role === 'teacher' ? 'block' : 'none';
        document.getElementById('student-zone').style.display = role === 'student' ? 'block' : 'none';
        closeAuth();
        nav('dash');
    }

    function renderStudents() {
        const cls = document.getElementById('sel-cls').value;
        const body = document.getElementById('student-list');
        body.innerHTML = "";
        const list = DB.students[cls] || [];
        list.forEach((n, i) => {
            body.innerHTML += `<tr><td>${i+1}</td><td>${n}</td>
                <td><input type="number" oninput="calc(${i})" class="p-score" value="0" style="width:60px; background:none; border:1px solid #334155; color:white;"></td>
                <td><input type="number" oninput="calc(${i})" class="s-score" value="0" style="width:60px; background:none; border:1px solid #334155; color:white;"></td>
                <td id="t-${i}">0</td><td id="lv-${i}">丁</td></tr>`;
        });
    }

    function calc(i) {
        const p = parseFloat(document.querySelectorAll('.p-score')[i].value) || 0;
        const s = parseFloat(document.querySelectorAll('.s-score')[i].value) || 0;
        const total = Math.round(p*0.6 + s*0.4);
        const cell = document.getElementById(`t-${i}`);
        cell.innerText = total;
        cell.className = total < 60 ? "score-fail" : "";
        let lv = "丁";
        if(total>=90) lv="優"; else if(total>=80) lv="甲"; else if(total>=70) lv="乙"; else if(total>=60) lv="丙";
        document.getElementById(`lv-${i}`).innerText = lv;
    }

    function nav(id) {
        document.querySelectorAll('.view-sec').forEach(v => v.style.display = 'none');
        document.getElementById('view-' + id).style.display = 'block';
    }
</script>
</body>
</html>
