<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台明中學 TM-OS V18.30.0</title>
    <style>
        :root { --p:#003a70; --a:#0078d4; --s:#107c10; --d:#d13438; }
        body { margin:0; font-family:sans-serif; display:flex; height:100vh; background:#f4f4f4; overflow:hidden; }
        aside { width:220px; background:var(--p); color:white; padding:15px; display:flex; flex-direction:column; gap:10px; }
        .nav-btn { background:none; border:none; color:white; text-align:left; padding:12px; cursor:pointer; border-radius:4px; }
        .nav-btn:hover, .active { background:var(--a); }
        main { flex:1; display:flex; flex-direction:column; background:white; }
        header { height:50px; border-bottom:1px solid #ddd; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
        .page { display:none; padding:20px; height:calc(100vh - 50px); overflow-y:auto; }
        table { width:100%; border-collapse:collapse; margin:10px 0; }
        th, td { border:1px solid #ddd; padding:8px; text-align:center; }
        .fail { color:var(--d); font-weight:bold; }
        #gate { position:fixed; inset:0; z-index:999; background:#000; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .card { border:1px solid #eee; padding:15px; border-radius:8px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div id="gate">
    <h1>TM-OS V18.30.0</h1>
    <button onclick="document.getElementById('gate').style.display='none'; showPage('cal')" style="padding:10px 20px; margin-bottom:10px;">📅 公開行事曆</button>
    <input type="password" id="pin" placeholder="PIN: 1234" style="padding:8px; text-align:center;"><br>
    <button onclick="if(document.getElementById('pin').value==='1234') document.getElementById('gate').style.display='none'">解鎖進入</button>
</div>
<aside>
    <h3>台明中學</h3>
    <button class="nav-btn active" onclick="showPage('home')">🏠 首頁</button>
    <button class="nav-btn" onclick="showPage('cal')">🗓️ 行事曆</button>
    <button class="nav-btn" onclick="showPage('tt')">📅 班級課表</button>
    <div id="t-menu" style="display:none; border-top:1px solid #555; padding-top:10px;">
        <button class="nav-btn" onclick="showPage('grade-t')">✍️ 成績錄取</button>
        <button class="nav-btn" onclick="showPage('disc-t')">⚖️ 獎懲提報</button>
        <button class="nav-btn" onclick="showPage('up')">⚙️ 檔案上傳</button>
    </div>
    <div id="s-menu" style="display:none; border-top:1px solid #555; padding-top:10px;">
        <button class="nav-btn" onclick="showPage('s-stage')">📊 階段成績</button>
        <button class="nav-btn" onclick="showPage('s-final')">📜 學期成績</button>
        <button class="nav-btn" onclick="showPage('s-disc')">🎖️ 獎懲紀錄</button>
        <button class="nav-btn" onclick="showPage('s-fam')">👤 家庭狀況</button>
    </div>
</aside>
<main>
    <header>
        <div id="clock"></div>
        <div id="auth">
            <button onclick="openLog('s')">學生</button> <button onclick="openLog('t')">教師</button>
        </div>
        <div id="user" style="display:none;"><span id="uname"></span> | <button onclick="location.reload()">登出</button></div>
    </header>
    <div id="p-home" class="page" style="display:block;"><h2>歡迎使用 TM-OS</h2><div class="card" id="sem-info"></div></div>
    <div id="p-cal" class="page"><h3>學校行事曆</h3><div id="cal-v" style="height:80%;">尚未上傳</div></div>
    <div id="p-tt" class="page"><h3>課表查詢</h3>年級<select id="qg"></select> 班<select id="qc"></select> <button onclick="viewTT()">查詢</button><hr><div id="tt-v" style="height:80%;"></div></div>
    <div id="p-grade-t" class="page"><h3>分科成績錄取</h3>
        年級<select id="eg" onchange="renG()"></select> 班<select id="ec" onchange="renG()"></select> 
        階段<select id="ee" onchange="renG()"><option value="1">一段</option><option value="2">二段</option><option value="3">三段</option></select>
        科目<select id="es" onchange="renG()"></select>
        <div id="l-hint"></div>
        <table><thead><tr><th>座號</th><th>學號</th><th>姓名</th><th>平時(60%)</th><th>段考(40%)</th><th>總和</th><th>等第</th></tr></thead><tbody id="gb"></tbody></table>
        <button onclick="saveG()" style="background:var(--s); color:white; padding:10px 20px;">💾 儲存成績</button>
    </div>
    <div id="p-disc-t" class="page"><h3>獎懲提報</h3><select id="dg" onchange="renD()"></select> <select id="dc" onchange="renD()"></select><table><thead><tr><th>座號</th><th>姓名</th><th>類別</th><th>點數</th><th>事件/日期</th></tr></thead><tbody id="db"></tbody></table><button onclick="saveD()">儲存獎懲</button></div>
    <div id="p-up" class="page"><h3>檔案中心</h3>
        行事曆PDF: <input type="file" id="f-cal"><button onclick="upF('cal')">儲存</button><hr>
        課表PDF: <select id="ug"></select><select id="uc"></select><input type="file" id="f-tt"><button onclick="upF('tt')">儲存</button>
    </div>
    <div id="p-s-stage" class="page"><h3>階段成績</h3><table id="ssv"></table></div>
    <div id="p-s-final" class="page"><h3>學期成績</h3><table id="sfv"></table></div>
    <div id="p-s-disc" class="page"><h3>獎懲卡</h3><div id="sdv"></div></div>
    <div id="p-s-fam" class="page"><h3>家庭狀況</h3><textarea id="sin" style="width:100%;height:200px;"></textarea><br><button onclick="user.fam=document.getElementById('sin').value;save();alert('存')">儲存</button></div>
</main>
<div id="l-mod" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:10px;">
        <h2 id="lt"></h2><input id="la" placeholder="帳號"><br><input type="password" id="lp" placeholder="密碼"><br>
        驗證碼:<span id="vc" style="background:#eee; padding:5px; letter-spacing:3px;"></span> <input id="lc" style="width:50px;"><br><br>
        <button onclick="doLog()" style="width:100%; background:var(--a); color:white;">登入</button>
    </div>
</div>
<script>
let D = JSON.parse(localStorage.getItem('TM_OS_V18')) || { p:{}, c:null, s:{} };
const A = { "語文":["國語","本土","英語"], "數學":["數學"], "社會":["歷史","地理","公民"], "自然":["物理","化學","生物","地科"], "藝術":["音樂","視覺","表演"], "綜合":["家政","童軍","輔導"], "科技":["生科","資訊"], "健體":["健教","體育"] };
let user=null, role='', cv='';
function save(){ localStorage.setItem('TM_OS_V18', JSON.stringify(D)); }
function getS(g,c){
    let k=`${g}-${c}`; if(!D.s[k]){
        let y=(g==7)?114:(g==8)?113:112; D.s[k]=[];
        for(let i=1;i<=24;i++){
            let n=i.toString().padStart(2,'0'), id=(i==24)?`${y}-${y}${c}24`:`${y}-${y}${c}${n}`;
            D.s[k].push({id, name:`學生${g}${c}${n}`, g:{1:{}, 2:{}}, fam:"", d:{r:0, p:0, l:[]} });
        }
    } return D.s[k];
}
function upS(){
    const n=new Date(), m=n.getMonth()+1, d=n.getDate(), sem=(m>=8||m<=1)?1:2;
    let ex=0, can=(sem==1 && [10,12,1].includes(m)) || (sem==2 && ((m==3&&d>=10)||m==4||m==5||(m==6&&d>=13)||m==7));
    if(sem==1) ex=(m==10)?1:(m==12)?2:(m==1)?3:0; else ex=(m==3||m==4)?1:(m==5)?2:3;
    document.getElementById('clock').innerText=n.toLocaleString();
    document.getElementById('sem-info').innerText=`114學年度 第${sem}學期 (目前階段:${ex||'非錄取期'})`;
    return {sem, ex, can};
}
function showPage(id){ 
    document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('p-'+id).style.display='block'; 
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.onclick.toString().includes(id)));
}
function openLog(r){ role=r; cv=Math.floor(1000+Math.random()*9000); document.getElementById('vc').innerText=cv; document.getElementById('l-mod').style.display='flex'; }
function doLog(){
    let a=document.getElementById('la').value, p=document.getElementById('lp').value, c=document.getElementById('lc').value;
    if(c!=cv) return alert('驗證碼錯');
    if(role=='t' && a=='Jason1010907' && p=='B124380907'){ role='t'; document.getElementById('t-menu').style.display='block'; login('Jason老師'); }
    else if(role=='s' && p=='28965789'){
        for(let k in D.s){ let f=D.s[k].find(x=>x.id==a); if(f){ user=f; document.getElementById('s-menu').style.display='block'; login(f.name); return; } }
    } else alert('錯');
}
function login(n){ document.getElementById('l-mod').style.display='none'; document.getElementById('auth').style.display='none'; document.getElementById('user').style.display='block'; document.getElementById('uname').innerText=n; }
function getLv(s){ return s>=90?'優':s>=80?'甲':s>=70?'乙':s>=60?'丙':'丁'; }
function renG(){
    let g=document.getElementById('eg').value, c=document.getElementById('ec').value, s=document.getElementById('es').value, x=document.getElementById('ee').value, st=upS(), lock=st.ex!=x||!st.can;
    document.getElementById('gb').innerHTML=getS(g,c).map((u,i)=>{
        let sc=(u.g[st.sem]&&u.g[st.sem][s]&&u.g[st.sem][s][x])||{p:0,e:0}, t=Math.round(sc.p*0.6+sc.e*0.4);
        return `<tr><td>${i+1}</td><td>${u.id}</td><td>${u.name}</td><td><input type="number" id="p${i}" value="${sc.p}" ${lock?'disabled':''}></td><td><input type="number" id="e${i}" value="${sc.e}" ${lock?'disabled':''}></td><td class="${t<60?'fail':''}">${t}</td><td>${getLv(t)}</td></tr>`;
    }).join('');
}
function saveG(){
    let g=document.getElementById('eg').value, c=document.getElementById('ec').value, s=document.getElementById('es').value, x=document.getElementById('ee').value, st=upS();
    getS(g,c).forEach((u,i)=>{ if(!u.g[st.sem][s])u.g[st.sem][s]={1:{p:0,e:0},2:{p:0,e:0},3:{p:0,e:0}}; u.g[st.sem][s][x]={p:parseInt(document.getElementById('p'+i).value), e:parseInt(document.getElementById('e'+i).value)}; });
    save(); alert('已存'); renG();
}
function upF(t){
    let f=document.getElementById('f-'+t).files[0], r=new FileReader();
    r.onload=(e)=>{ if(t=='cal') D.c=e.target.result; else D.p[`${document.getElementById('ug').value}-${document.getElementById('uc').value}`]=e.target.result; save(); alert('存'); }; r.readAsDataURL(f);
}
function viewTT(){ let k=`${document.getElementById('qg').value}-${document.getElementById('qc').value}`; document.getElementById('tt-v').innerHTML=D.p[k]?`<embed src="${D.p[k]}" width="100%" height="100%">`:'無'; }
function renD(){
    document.getElementById('db').innerHTML=getS(document.getElementById('dg').value,document.getElementById('dc').value).map((u,i)=>`<tr><td>${i+1}</td><td>${u.name}</td><td><select id="dt${i}"><option value="r">獎</option><option value="p">懲</option></select></td><td><input id="dv${i}" type="number" value="0"></td><td><input id="dl${i}" placeholder="事/西元日期"></td></tr>`).join('');
}
function saveD(){
    getS(document.getElementById('dg').value,document.getElementById('dc').value).forEach((u,i)=>{ let v=parseInt(document.getElementById('dv'+i).value); if(v>0){ if(document.getElementById('dt'+i).value=='r') u.d.r+=v; else u.d.p+=v; u.d.l.push(document.getElementById('dl'+i).value); } });
    save(); alert('存'); renD();
}
function renderS(){
    let st=upS(), h='<tr><th>科目</th><th>一</th><th>二</th><th>三</th></tr>';
    for(let k in A) A[k].forEach(s=>{ h+=`<tr><td>${s}</td>`; for(let i=1;i<=3;i++){ let g=(user.g[st.sem][s]&&user.g[st.sem][s][i])||null; h+=g?`<td class="${(g.p*.6+g.e*.4)<60?'fail':''}">${Math.round(g.p*.6+g.e*.4)}</td>`:'<td>-</td>'; } h+='</tr>'; });
    document.getElementById('ssv').innerHTML=h;
}
function renderF(){
    let st=upS(), h='<tr><th>科目</th><th>平時</th><th>階段</th><th>總分</th><th>等第</th></tr>';
    for(let k in A) A[k].forEach(s=>{ let p=0, d=0, c=0; for(let i=1;i<=3;i++){ let g=user.g[st.sem][s]&&user.g[st.sem][s][i]; if(g){ p+=g.p; d+=(g.p*.6+g.e*.4); c++; } }
        if(c>0){ let t=Math.round((p/c)*.6+(d/c)*.6); h+=`<tr><td>${s}</td><td>${Math.round(p/c)}</td><td>${Math.round(d/c)}</td><td class="${t<60?'fail':''}">${t}</td><td>${getLv(t)}</td></tr>`; }
    }); document.getElementById('sfv').innerHTML=h;
}
window.onload=()=>{
    ['qg','eg','dg','ug'].forEach(id=>[7,8,9].forEach(v=>document.getElementById(id).add(new Option(v+'年',v))));
    ['qc','ec','dc','uc'].forEach(id=>{for(let i=1;i<=28;i++)document.getElementById(id).add(new Option(i+'班',i.toString().padStart(2,'0')));});
    for(let k in A){ let g=document.createElement('optgroup'); g.label=k; A[k].forEach(s=>g.add(new Option(s,s))); document.getElementById('es').add(g); }
    if(D.c) document.getElementById('cal-v').innerHTML=`<embed src="${D.c}" width="100%" height="100%">`;
    setInterval(upS,1000); upS();
};
</script>
</body>
                                                                     </html>
