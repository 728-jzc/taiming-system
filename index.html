<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台明中學-旗艦 3.0 (三欄自動計算版)</title>
    <style>
        :root { --main: #2c3e50; --stu: #27ae60; --tea: #2980b9; --bg: #f4f7f9; --exam: #fff4f4; --norm: #f4fff4; --total: #e8f4fd; --gold: #f1c40f; --danger: #e74c3c; }
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        /* 鎖定畫面動畫 */
        #sys-lock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26,37,47,0.98); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .pin-box { background: white; padding: 40px; border-radius: 25px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.5); border: 2px solid var(--tea); }
        .pin-input { width: 200px; font-size: 35px; letter-spacing: 15px; text-align: center; padding: 15px; border: 3px solid #eee; border-radius: 15px; margin-bottom: 20px; color: #333; outline: none; transition: 0.3s; }
        .pin-input:focus { border-color: var(--tea); }
        .shake { animation: shake 0.4s; border-color: var(--danger) !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* 側邊導航反應 */
        #side { width: 260px; background: linear-gradient(180deg, var(--main) 0%, #1a252f 100%); color: white; padding: 30px 15px; flex-shrink: 0; box-shadow: 5px 0 20px rgba(0,0,0,0.2); z-index: 100; }
        .menu-item { width: 100%; padding: 16px 20px; margin: 8px 0; border: none; background: transparent; color: rgba(255,255,255,0.6); border-radius: 12px; cursor: pointer; text-align: left; transition: 0.3s; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover { background: rgba(255,255,255,0.1); color: white; padding-left: 30px; }
        .menu-item.active { background: var(--tea); color: white; font-weight: bold; box-shadow: 0 4px 15px rgba(41,128,185,0.4); }

        #content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { background: white; padding: 0 40px; height: 80px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* 頁面切換動畫 */
        .page { display: none; padding: 40px; overflow-y: auto; height: calc(100vh - 80px); box-sizing: border-box; }
        .active-page { display: block; animation: pageIn 0.5s ease-out; }
        @keyframes pageIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* 成績三欄自動計算樣式 */
        .table-wrap { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: #34495e; color: white; padding: 15px; font-size: 14px; position: sticky; top: 0; }
        td { padding: 12px; border: 1px solid #f0f0f0; font-size: 15px; transition: 0.3s; }
        
        .score-input { width: 60px; padding: 10px; text-align: center; border: 2px solid #eee; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .score-input:focus { border-color: var(--tea); background: white; }
        .total-box { width: 65px; padding: 10px; text-align: center; background: var(--total); border: 2px solid #b3d9ff; border-radius: 8px; font-weight: 900; color: #1c4d75; outline: none; }
        
        /* 紅字預警反應 */
        .fail-score { color: var(--danger) !important; background: #fff2f2 !important; border-color: var(--danger) !important; animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.4); } 70% { box-shadow: 0 0 0 10px rgba(231,76,60,0); } 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); } }

        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-main { background: var(--tea); color: white; }
        .btn-main:hover { background: #2471a3; transform: translateY(-2px); }
    </style>
</head>
<body>

<div id="sys-lock">
    <div class="pin-box" id="pin-box">
        <h1 style="color:#333; margin:0 0 10px 0;">校務系統安全存取</h1>
        <p style="color:#888; margin-bottom:25px;">請輸入 4 位數密鑰以啟動反應</p>
        <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" oninput="triggerPinCheck(this)">
        <div id="pin-hint" style="font-size:12px; color:#bbb;">預設: 1234</div>
    </div>
</div>

<div id="side">
    <div style="text-align:center; margin-bottom:50px;">
        <div style="font-size: 22px; font-weight: 900; letter-spacing: 2px;">台明中學</div>
        <div style="font-size: 11px; opacity: 0.4; margin-top: 5px;">FLAGSHIP SYSTEM v3.0</div>
    </div>
    <button class="menu-item active" onclick="goPage('p-home', this)">🏠 系統儀表板</button>
    <button class="menu-item" onclick="goPage('p-sch', this)">📅 班級課表查詢</button>
    <button class="menu-item" onclick="handleTeacherAccess(this)">📊 成績自動運算</button>
</div>

<div id="content">
    <header>
        <div id="user-display" style="font-size: 18px; font-weight: bold; color: var(--main);">👤 訪客存取中</div>
        <button id="login-btn" class="btn btn-main" onclick="teacherLogin()">教師管理登入</button>
    </header>

    <div id="p-home" class="page active-page">
        <div style="background:white; padding:40px; border-radius:20px; border-left:15px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <h2 style="margin-top:0;">⚡ 系統反應狀態：良好</h2>
            <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
            <p>● <b>自動計算模式</b>：平時 (60%) / 階段 (40%) 已啟動。</p>
            <p>● <b>紅字預警反應</b>：數值 < 60 自動標註。項目：總分、平時、階段。</p>
            <p>● <b>連動範圍</b>：支援全校 7-9 年級，共 84 個班級數據。</p>
        </div>
    </div>

    <div id="p-sch" class="page">
        <h1>📅 智慧課程表查詢</h1>
        <div style="background:white; padding:25px; border-radius:15px; display:flex; gap:20px; align-items:center; margin-bottom:30px; border:1px solid #ddd;">
            年級：<select id="g-sel" style="padding:10px; border-radius:8px;"><option value="7">7 年級</option><option value="8">8 年級</option><option value="9">9 年級</option></select>
            班級：<select id="c-sel" style="padding:10px; border-radius:8px;"></select>
            <button class="btn btn-main" onclick="fetchSchedule()">執行查詢反應</button>
        </div>
        <div id="sch-render-area" class="table-wrap" style="display:none;"></div>
    </div>

    <div id="p-grade-tea" class="page">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1>📊 成績權重管理 (三欄連動版)</h1>
            <div style="color:var(--danger); font-weight:bold; font-size:14px;">⚡ 總分自動同步中</div>
        </div>
        <div class="table-wrap" id="tea-grid"></div>
    </div>
</div>

<script>
// --- 數據庫與設定 ---
const ACCESS_PIN = "1234";
const STUDENTS = ["林承綸","陳思綸","國世並","洪昱辰","吳信榆","林書騰","吳郁庭","何雅維","許承珮","洪雅翰","劉雅彤","曾文釋","陳哲翰","蘇子瑄","陳郁辰","鄭宏翰","蔡柏庭","簡品綸","吳書萱","周品瑄","何宏彤","簡宏柔","鄭思茹","陳哲珮"];
let isAuthorized = false;

// 班級選單初始化 (1-28)
const cSelect = document.getElementById('c-sel');
for(let i=1; i<=28; i++) {
    let opt = document.createElement('option'); opt.value = i; opt.innerText = i + " 班";
    cSelect.appendChild(opt);
}

// 1. PIN 碼進入反應
function triggerPinCheck(el) {
    if(el.value.length === 4) {
        if(el.value === ACCESS_PIN) {
            document.getElementById('sys-lock').style.transform = 'translateY(-100%)';
            document.getElementById('sys-lock').style.opacity = '0';
            setTimeout(() => document.getElementById('sys-lock').style.display = 'none', 800);
        } else {
            el.classList.add('shake');
            setTimeout(() => { el.value = ""; el.classList.remove('shake'); }, 400);
        }
    }
}

// 2. 教師登入反應
function teacherLogin() {
    let acc = prompt("請輸入 Jason 老師專屬帳號：");
    if(acc === "Jason1010907") {
        isAuthorized = true;
        document.getElementById('user-display').innerText = "👨‍🏫 Jason 老師 (線上管理中)";
        document.getElementById('login-btn').style.display = "none";
        alert("✅ 權限驗證成功！成績管理按鈕已解鎖。");
    }
}

function handleTeacherAccess(btn) {
    if(!isAuthorized) { alert("此區域受限，請先點擊右上角登入。"); return; }
    goPage('p-grade-tea', btn);
    renderGradeSystem();
}

// 3. 三欄自動計算核心反應
function renderGradeSystem() {
    let html = `<table><thead><tr><th>座號</th><th>姓名</th><th>平時成績 (60%)</th><th>階段成績 (40%)</th><th>加權總分 (100%)</th><th>操作回饋</th></tr></thead><tbody>`;
    STUDENTS.forEach((name, i) => {
        html += `<tr>
            <td>${i+1}</td><td style="font-weight:bold;">${name}</td>
            <td style="background:var(--norm)"><input class="score-input" id="n-${i}" value="85" oninput="runLiveCalc(${i})"></td>
            <td style="background:var(--exam)"><input class="score-input" id="e-${i}" value="80" oninput="runLiveCalc(${i})"></td>
            <td style="background:var(--total)"><input class="total-box" id="t-${i}" value="83.0" readonly></td>
            <td><button class="btn btn-main" style="font-size:12px; padding:6px 15px;" onclick="saveSignal(${i})">儲存</button></td>
        </tr>`;
    });
    document.getElementById('tea-grid').innerHTML = html + `</tbody></table>`;
}

function runLiveCalc(idx) {
    const nVal = parseFloat(document.getElementById(`n-${idx}`).value) || 0;
    const eVal = parseFloat(document.getElementById(`e-${idx}`).value) || 0;
    
    // 公式反應：平時 60% + 階段 40%
    const total = (nVal * 0.6) + (eVal * 0.4);
    const tBox = document.getElementById(`t-${idx}`);
    tBox.value = total.toFixed(1);

    // 紅字預警連動
    const inputs = [document.getElementById(`n-${idx}`), document.getElementById(`e-${idx}`), tBox];
    inputs.forEach(el => {
        if(parseFloat(el.value) < 60) el.classList.add('fail-score');
        else el.classList.remove('fail-score');
    });
}

// 4. 課表查詢反應
function fetchSchedule() {
    const g = document.getElementById('g-sel').value;
    const c = document.getElementById('c-sel').value;
    const area = document.getElementById('sch-render-area');
    area.style.display = "block";
    area.innerHTML = `<div style="padding:50px; text-align:center; color:#888;">正在獲取 ${g}年${c}班 數據反應...</div>`;

    setTimeout(() => {
        if(g==="7" && c==="28") {
            let h = `<table><tr><th colspan="6">${g}年${c}班 課程表 (導師：張朝森)</th></tr><tr><th>時段</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>`;
            const rows = [["08:00","早自習","早自習","早自習","早自習","早自習"],["1","國文","數學","英文","自然","地理"],["午休","午休","午休","午休","午休","午休"],["8","輔導","輔導","補強","補強","自習"]];
            rows.forEach(r => h += `<tr>${r.map((d,i)=>`<td ${i==0?'style="background:#f9f9f9;font-weight:bold"':''}>${d}</td>`).join('')}</tr>`);
            area.innerHTML = h + `</table>`;
        } else {
            area.innerHTML = `<div style="padding:50px; text-align:center;">已載入 ${g}年${c}班 標準校務課表</div>`;
        }
    }, 400);
}

function saveSignal(idx) {
    alert(`【系統反應】座號 ${idx+1} ${STUDENTS[idx]} 數據已成功存入伺服器。`);
}

function goPage(id, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.getElementById(id).classList.add('active-page');
    btn.classList.add('active');
}
</script>
</body>
</html>
