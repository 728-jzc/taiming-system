<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台明中學 TM-OS V23.30.14 旗艦版</title>
    <style>
        :root { --p:#003a70; --a:#0078d4; --s:#107c10; --d:#d13438; --bg:#f4f7f9; }
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { margin:0; display:flex; height:100vh; background:var(--bg); overflow:hidden; }
        aside { width:250px; background:var(--p); color:white; padding:15px; display:flex; flex-direction:column; gap:8px; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .nav-btn { background:none; border:none; color:white; text-align:left; padding:12px; cursor:pointer; border-radius:6px; font-size:15px; transition:0.2s; }
        .nav-btn:hover, .active { background:var(--a); font-weight:bold; }
        main { flex:1; display:flex; flex-direction:column; background:white; position:relative; }
        header { height:65px; border-bottom:1px solid #ddd; display:flex; align-items:center; justify-content:space-between; padding:0 25px; background:white; z-index:100; }
        .page { display:none; padding:30px; height:calc(100vh - 65px); overflow-y:auto; }
        table { width:100%; border-collapse:collapse; margin-top:15px; background:white; }
        th, td { border:1px solid #eee; padding:12px; text-align:center; }
        th { background:#f8f9fa; color:var(--p); position: sticky; top: 0; }
        .fail { color:var(--d); font-weight:bold; }
        .card { background:white; border:1px solid #eef; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-bottom:25px; }
        /* 門戶畫面 */
        #gate { position:fixed; inset:0; z-index:9999; background:linear-gradient(135deg, #001529, #003a70); color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        /* 登入彈窗 */
        #l-mod { display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; backdrop-filter:blur(5px); }
        input, select, textarea { padding:10px; border-radius:6px; border:1px solid #ccc; outline:none; }
        button { cursor:pointer; border:none; transition:transform 0.1s; border-radius:6px; }
        /* 按鈕點擊反應指令 */
        button:active { transform: scale(0.96); opacity: 0.8; }
    </style>
</head>
<body>

<div id="gate">
    <h1 style="font-size:3em; margin-bottom:10px;">TM-OS <span style="color:#00dcff">V23.30.14</span></h1>
    <div style="background:rgba(255,255,255,0.1); padding:20px; border-radius:10px; margin-bottom:20px; text-align:center;">
        <b>全校編制：2,074 位學生</b><br>
        7年級: 726人 | 8年級: 726人 | 9年級: 622人
    </div>
    <div style="background:rgba(255,255,255,0.1); padding:25px; border-radius:15px; width:320px; text-align:center;">
        <input type="password" id="pin" placeholder="系統 PIN: 1234" style="width:100%; text-align:center; margin-bottom:15px;"><br>
        <button onclick="checkPin()" style="width:100%; background:var(--a); color:white; padding:12px; font-weight:bold;">解鎖進入系統</button>
    </div>
</div>

<aside>
    <div style="text-align:center; margin-bottom:20px;"><h2 style="margin:0; color:#00dcff;">台明中學</h2><small id="side-sem">114學年度</small></div>
    <button class="nav-btn active" onclick="showPage('home')">🏠 系統首頁</button>
    <button class="nav-btn" onclick="showPage('cal')">🗓️ 學校行事曆</button>
    <button class="nav-btn" onclick="showPage('tt')">📅 班級課表查詢</button>
    <div id="t-menu" style="display:none; border-top:1px solid rgba(255,255,255,0.2); margin-top:10px; padding-top:10px;">
        <button class="nav-btn" onclick="showPage('grade-t')">✍️ 成績錄取 (單科)</button>
        <button class="nav-btn" onclick="showPage('up')">⚙️ 檔案發佈中心</button>
    </div>
    <div id="s-menu" style="display:none; border-top:1px solid rgba(255,255,255,0.2); margin-top:10px; padding-top:10px;">
        <button class="nav-btn" onclick="showPage('s-final')">📜 學習總成績單</button>
        <button class="nav-btn" onclick="showPage('s-fam')">👤 家庭狀況填報</button>
    </div>
</aside>

<main>
    <header>
        <div id="clock" style="font-weight:bold; color:var(--p);"></div>
        <div id="auth">
            <button onclick="openLog('s')" style="padding:8px 20px; background:#e0e0e0;">學生登入</button>
            <button onclick="openLog('t')" style="padding:8px 20px; background:var(--p); color:white; margin-left:10px;">教師登入</button>
        </div>
        <div id="user-info" style="display:none;"><span id="uname" style="font-weight:bold; color:var(--a);"></span> | <button onclick="location.reload()">登出</button></div>
    </header>

    <div id="p-home" class="page" style="display:block;">
        <div class="card">
            <h2>系統概況</h2>
            <p>目前資料庫已掛載全校 2,074 位學生名額。</p>
            <p>● 七年級：726人 (114入學)<br>● 八年級：726人 (113入學)<br>● 九年級：622人 (112入學)</p>
        </div>
    </div>
    <div id="p-cal" class="page"><h3>🗓️ 學校行事曆</h3><div id="cal-v" class="card" style="height:80%;">尚未上傳</div></div>
    <div id="p-tt" class="page"><h3>📅 班級課表查詢</h3>
        年級 <select id="qg"></select> 班級 <select id="qc"></select> <button onclick="viewTT()" style="background:var(--a); color:white; padding:8px 20px;">按此查詢</button>
        <div id="tt-v" style="height:70%; margin-top:20px;"></div>
    </div>

    <div id="p-grade-t" class="page"><h3>✍️ 階段成績錄取</h3>
        篩選：<select id="eg" onchange="renG()"></select> <select id="ec" onchange="renG()"></select> 
        科目：<select id="es" onchange="renG()"></select>
        <table><thead><tr><th>座號</th><th>學號</th><th>平時(60%)</th><th>段考(40%)</th><th>總計</th></tr></thead><tbody id="gb"></tbody></table>
        <button onclick="saveG()" style="background:var(--s); color:white; padding:15px; width:100%; margin-top:10px; font-weight:bold;">💾 點擊儲存成績</button>
    </div>

    <div id="p-s-fam" class="page"><h3>👤 家庭狀況填報</h3><textarea id="sin" style="width:100%; height:250px; padding:15px;"></textarea><br><button onclick="saveFam()" style="background:var(--s); color:white; padding:12px 30px; margin-top:10px;">💾 儲存內容</button></div>

    <div id="p-up" class="page"><h3>⚙️ 檔案發佈中心</h3>
        <div class="card">校級行事曆: <input type="file" id="f-cal"> <button onclick="upF('cal')" style="background:var(--a); color:white; padding:5px 15px;">儲存並公開</button></div>
        <div class="card">班級課表: <select id="ug"></select> <select id="uc"></select> <input type="file" id="f-tt"> <button onclick="upF('tt')" style="background:var(--a); color:white; padding:5px 15px;">儲存</button></div>
    </div>
</main>

<div id="l-mod">
    <div style="background:white; padding:40px; border-radius:20px; width:350px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
        <h2 id="lt">帳號登入</h2>
        <input id="la" placeholder="帳號" style="width:100%; margin-bottom:10px;"><br>
        <input type="password" id="lp" placeholder="密碼" style="width:100%; margin-bottom:10px;"><br>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <div id="vc" style="background:#eee; padding:10px; flex:1; font-weight:bold; letter-spacing:5px;"></div>
            <input id="lc" placeholder="驗證碼" style="width:80px;">
        </div>
        <button onclick="doLog()" style="width:100%; background:var(--a); color:white; padding:15px; font-weight:bold;">立即登入</button>
        <button onclick="document.getElementById('l-mod').style.display='none'" style="margin-top:15px; border:none; background:none; color:gray;">取消</button>
    </div>
</div>

<script>
let D = JSON.parse(localStorage.getItem('TM_V23_DATA')) || { p:{}, c:null, s:{} };
const A = { "語文":["國語文","本土語文","英語文"],"數學":["數學"],"社會":["歷史","地理","公民"],"自然":["物理","化學","生物","地科"],"藝術":["音樂","視覺藝術","表演藝術"],"綜合":["家政","童軍","輔導"],"科技":["生活科技","資訊科技"],"健體":["健康教育","體育"] };
let user=null, role='', cv='';

function save(){ localStorage.setItem('TM_V23_DATA', JSON.stringify(D)); }

function getS(g,c){
    let k=`${g}-${c}`;
    if(!D.s[k]){
        let y=(g==7)?114:(g==8)?113:112;
        D.s[k]=[];
        for(let i=1;i<=24;i++){
            let n=i.toString().padStart(2,'0');
            // 24號特殊學號格式邏輯
            let id=(i==24)?`${y}-${y}${c}24` : `${y}-${y}${c}${n}`;
            D.s[k].push({id, name:`學生${g}${c}${n}`, g:{}, fam:""});
        }
    } return D.s[k];
}

function checkPin(){ if(document.getElementById('pin').value==='1234'){ document.getElementById('gate').style.display='none'; } else { alert('PIN碼錯誤！'); } }

function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.style.display='none');
    document.getElementById('p-'+id).style.display='block';
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.onclick.toString().includes(id)));
}

function openLog(r){ role=r; cv=Math.floor(1000+Math.random()*9000).toString(); document.getElementById('vc').innerText=cv; document.getElementById('l-mod').style.display='flex'; }

function doLog(){
    let a=document.getElementById('la').value.trim(), p=document.getElementById('lp').value.trim(), c=document.getElementById('lc').value.trim();
    if(c!==cv){ alert('驗證碼錯誤！'); return; }
    
    if(role=='t'){
        if(a=='Jason1010907' && p=='B124380907'){
            document.getElementById('t-menu').style.display='block'; login('Jason老師');
        } else { alert('教師帳密錯誤'); }
    } else {
        if(p=='28965789'){
            // 全校 2,074 名額快速掃描
            for(let g of [7,8,9]){
                for(let b=1;b<=28;b++){
                    let ck=b.toString().padStart(2,'0');
                    let f=getS(g,ck).find(s=>s.id==a);
                    if(f){ user=f; document.getElementById('s-menu').style.display='block'; login(f.name); return; }
                }
            }
            alert('查無此學生學號');
        } else { alert('密碼錯誤'); }
    }
}

function login(n){
    document.getElementById('l-mod').style.display='none';
    document.getElementById('auth').style.display='none';
    document.getElementById('user-info').style.display='block';
    document.getElementById('uname').innerText=n;
    alert('登入成功，歡迎 ' + n);
}

function upF(t){
    let f=document.getElementById('f-'+t).files[0]; if(!f) return;
    let r=new FileReader(); r.onload=(e)=>{
        if(t=='cal') D.c=e.target.result;
        else D.p[`${document.getElementById('ug').value}-${document.getElementById('uc').value}`]=e.target.result;
        save(); alert('檔案儲存成功！');
    }; r.readAsDataURL(f);
}

function viewTT(){
    let k=`${document.getElementById('qg').value}-${document.getElementById('qc').value}`;
    document.getElementById('tt-v').innerHTML=D.p[k]?`<embed src="${D.p[k]}" width="100%" height="100%">`:'<p style="text-align:center; color:gray;">此班級尚未上傳課表 PDF</p>';
}

function renG(){
    let g=document.getElementById('eg').value, c=document.getElementById('ec').value;
    document.getElementById('gb').innerHTML=getS(g,c).map((u,i)=>`<tr><td>${i+1}</td><td>${u.id}</td><td><input type="number" value="0"></td><td><input type="number" value="0"></td><td>0</td></tr>`).join('');
}

function saveG(){ save(); alert('成績儲存成功！已同步至學生端。'); }
function saveFam(){ user.fam=document.getElementById('sin').value; save(); alert('家庭填報已儲存！'); }

window.onload=()=>{
    [7,8,9].forEach(v=>{ ['qg','eg','ug'].forEach(id=>document.getElementById(id).add(new Option(v+'年級',v))); });
    for(let i=1;i<=28;i++){
        let n=i.toString().padStart(2,'0');
        ['qc','ec','uc'].forEach(id=>document.getElementById(id).add(new Option(n+'班',n)));
    }
    for(let k in A) A[k].forEach(s=>document.getElementById('es').add(new Option(s,s)));
    if(D.c) document.getElementById('cal-v').innerHTML=`<embed src="${D.c}" width="100%" height="100%">`;
    document.getElementById('clock').innerText = new Date().toLocaleString('zh-TW', {hour12:false});
};
</script>
</body>
</html>
