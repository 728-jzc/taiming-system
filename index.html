<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台明中學 | 雲端校務系統 (實時同步旗艦版)</title>
    <style>
        :root {
            --bg: #020617; --card: #0f172a; --accent: #38bdf8; --teacher: #fbbf24;
            --student: #34d399; --danger: #f43f5e; --border: #1e293b;
        }
        * { box-sizing: border-box; transition: all 0.2s; }
        body { margin: 0; background: var(--bg); color: #e2e8f0; font-family: 'Inter', "Microsoft JhengHei", sans-serif; display: flex; height: 100vh; }

        /* 系統入口密碼 (Condition 31) */
        #pin-gate { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pin-in { background: transparent; border: 2px solid var(--accent); color: var(--accent); font-size: 3rem; width: 220px; text-align: center; border-radius: 12px; letter-spacing: 15px; outline: none; }

        /* 佈局架構 */
        aside { width: 260px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; background: rgba(15, 23, 42, 0.5); }
        .viewport { flex: 1; padding: 40px; overflow-y: auto; }

        /* 按鈕樣式 (要有反應) */
        .btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        .btn-blue { background: var(--accent); color: #000; }
        .btn-blue:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .nav-btn { padding: 18px 25px; color: #94a3b8; background: none; border: none; text-align: left; width: 100%; cursor: pointer; }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
        .nav-btn.active { color: var(--accent); border-left: 4px solid var(--accent); background: rgba(56, 189, 248, 0.05); }

        /* 表格與成績 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.02); }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: center; }
        th { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
        .fail { color: var(--danger); font-weight: bold; }
        input[type="number"] { width: 60px; background: #1e293b; color: white; border: 1px solid #334155; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="pin-gate">
        <h2 style="color:var(--accent); letter-spacing:5px;">TM-CLOUD OS</h2>
        <input type="password" id="sys-pin" class="pin-in" maxlength="4">
        <button class="btn btn-blue" onclick="checkGate()" style="margin-top:30px;">進入校務系統</button>
    </div>

    <aside>
        <div style="padding: 30px; font-weight: 900; color: var(--accent); font-size: 1.5rem;">台明中學</div>
        <button class="nav-btn active" onclick="nav('home', this)">🏠 系統首頁</button>
        <button class="nav-btn" onclick="nav('schedule', this)">📅 班級課表查詢</button>
        <div id="teacher-ops" style="display:none;">
            <button class="nav-btn" onclick="nav('grading', this)" style="color:var(--teacher)">✍️ 成績同步錄取</button>
        </div>
        <div id="student-ops" style="display:none;">
            <button class="nav-btn" onclick="nav('report', this)" style="color:var(--student)">📝 查看個人成績</button>
        </div>
    </aside>

    <main>
        <header>
            <div id="term-info"></div>
            <div>
                <button class="btn" style="background:var(--student); color:black;" onclick="openAuth('s')">學生登入</button>
                <button class="btn" style="background:var(--teacher); color:black; margin-left:10px;" onclick="openAuth('t')">教師登入</button>
                <span id="user-display" style="margin-left:20px; font-weight:bold;"></span>
            </div>
        </header>

        <div class="viewport">
            <div id="view-home" class="view">
                <h2 id="welcome-title">歡迎使用雲端校務系統</h2>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:25px; margin-top:30px;">
                    <div style="background:var(--card); padding:30px; border-radius:15px; border:1px solid var(--border);">
                        <h3>七年級</h3><p>班級：28 班</p><p>人數：726 位</p>
                    </div>
                    <div style="background:var(--card); padding:30px; border-radius:15px; border:1px solid var(--border);">
                        <h3>八年級</h3><p>班級：28 班</p><p>人數：726 位</p>
                    </div>
                    <div style="background:var(--card); padding:30px; border-radius:15px; border:1px solid var(--border);">
                        <h3>九年級</h3><p>班級：22 班</p><p>人數：622 位</p>
                    </div>
                </div>
            </div>

            <div id="view-schedule" class="view" style="display:none;">
                <div style="display:flex; gap:15px; align-items:center;">
                    年級：<select id="gr-sel" onchange="updateClassList()"><option value="7">七年級</option><option value="8">八年級</option><option value="9">九年級</option></select>
                    班級：<select id="cl-sel"></select>
                    <button class="btn btn-blue" onclick="renderTT()">查看課表</button>
                </div>
                <div id="tt-area" style="margin-top:30px;"></div>
            </div>

            <div id="view-grading" class="view" style="display:none;">
                <h3>教師管理：成績實時同步系統</h3>
                <div style="margin-bottom:20px; display:flex; gap:20px;">
                    班級：<select id="grade-cls-sel" onchange="refreshGradeTable()"></select>
                    科目：<select id="grade-sub-sel" onchange="refreshGradeTable()">
                        <option>國文</option><option>英文</option><option>數學</option><option>自然科學</option><option>地理</option><option>歷史</option>
                    </select>
                    <button class="btn" style="background:var(--danger); color:white;" onclick="exportFails()">導出不及格名單</button>
                </div>
                <table>
                    <thead><tr><th>座號</th><th>姓名</th><th>平時(60%)</th><th>階段(40%)</th><th>總和(100%)</th><th>等第</th><th>評語</th></tr></thead>
                    <tbody id="grade-list"></tbody>
                </table>
                <button class="btn btn-blue" style="margin-top:20px;" onclick="saveData()">💾 儲存並同步到學生端</button>
            </div>

            <div id="view-report" class="view" style="display:none;">
                <h3 id="report-title">您的學期成績單</h3>
                <table>
                    <thead><tr><th>科目</th><th>平時(60%)</th><th>階段(40%)</th><th>總計</th><th>等第</th><th>排名</th></tr></thead>
                    <tbody id="stu-report-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="auth-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center;">
        <div style="background:var(--card); padding:40px; border-radius:20px; border:1px solid var(--accent); width:400px;">
            <h3 id="auth-title">登入</h3>
            <input type="text" id="acc" placeholder="帳號 (114-114...)" style="width:100%; padding:12px; margin-bottom:15px; background:#1e293b; color:white; border:1px solid #334155;">
            <input type="password" id="pw" placeholder="密碼" style="width:100%; padding:12px; margin-bottom:15px; background:#1e293b; color:white; border:1px solid #334155;">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div id="v-code" style="background:#334155; color:var(--accent); font-weight:bold; padding:10px; letter-spacing:5px;"></div>
                <input type="text" id="v-in" placeholder="驗證" style="flex:1; padding:10px;">
            </div>
            <button class="btn btn-blue" style="width:100%;" onclick="handleLogin()">進入系統</button>
        </div>
    </div>

<script>
    /* [15] 學年度與日期同步引擎 */
    function syncClock() {
        const now = new Date();
        const y = now.getFullYear();
        const schYear = (now.getMonth() + 1 >= 8) ? y - 1911 : y - 1912;
        const term = (now.getMonth() + 1 >= 2 && now.getMonth() + 1 <= 7) ? "二" : "一";
        document.getElementById('term-info').innerText = `台明中學 ${schYear}學年度 第${term}學期 | ${y}/${now.getMonth()+1}/${now.getDate()}`;
    }

    /* [24, 25, 26] 數據庫中心 */
    let GLOBAL_DB = JSON.parse(localStorage.getItem('TM_DB')) || {
        scores: {}, // 格式: { "728": { "國文": { "學生帳號": {p:60, s:40} } } }
        teacher: { id: "Jason1010907", pw: "B124380907" }
    };

    function checkGate() {
        if(document.getElementById('sys-pin').value === "1234") {
            document.getElementById('pin-gate').style.display = 'none';
            init();
        } else { alert("PIN 錯誤"); }
    }

    function init() {
        syncClock();
        updateClassList();
        genV();
        setInterval(syncClock, 60000);
    }

    function updateClassList() {
        const g = document.getElementById('gr-sel').value;
        const cSel = document.getElementById('cl-sel');
        const gCSel = document.getElementById('grade-cls-sel');
        cSel.innerHTML = ""; gCSel.innerHTML = "";
        let count = (g === "9") ? 22 : 28;
        for(let i=1; i<=count; i++) {
            let val = i.toString().padStart(2, '0');
            cSel.add(new Option(`${i} 班`, val));
            gCSel.add(new Option(`${i} 班`, val));
        }
    }

    /* [28, 34] 728 課表 PDF 完整寫入 */
    function renderTT() {
        const g = document.getElementById('gr-sel').value;
        const c = document.getElementById('cl-sel').value;
        const area = document.getElementById('tt-area');
        if(g == "7" && c == "28") {
            area.innerHTML = `<h4>7年28班 課表 (導師：張朝森)</h4>
            <table><tr><th>時間</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>
            <tr><td>07:50</td><td>國文(廖健哲)</td><td>體育(廖柯智)</td><td>生物(揮方無)</td><td>體育(廖柯智)</td><td>公民(國第一)</td></tr>
            <tr><td>08:45</td><td>數學(慧芳珍)</td><td>英文(又蔫新)</td><td>國文(廖健哲)</td><td>數學(慧芳珍)</td><td>生物(揮方無)</td></tr>
            <tr><td>13:00</td><td>公民(國第一)</td><td>表演藝術</td><td>資訊(吳建如)</td><td>英文(又蔫新)</td><td>國文(廖健哲)</td></tr>
            </table>`;
        } else { area.innerHTML = `<p>此班級課表請查閱校內公告系統。</p>`; }
    }

    let currentRole = null;
    let currentUser = null;

    function openAuth(type) {
        currentRole = type;
        document.getElementById('auth-modal').style.display = 'flex';
        genV();
    }

    function genV() { document.getElementById('v-code').innerText = Math.floor(1000 + Math.random()*9000); }

    function handleLogin() {
        const acc = document.getElementById('acc').value;
        const pw = document.getElementById('pw').value;
        if(currentRole === 't') {
            if(acc === GLOBAL_DB.teacher.id && pw === GLOBAL_DB.teacher.pw) {
                loginSuccess('t', 'Jason 管理員');
            } else { alert("帳密錯誤"); }
        } else {
            if(acc.startsWith("114-114") && pw === "28965789") {
                loginSuccess('s', `學生 ${acc.slice(-4)}`, acc);
            } else { alert("學生密碼預設為學校電話"); }
        }
    }

    function loginSuccess(role, name, id) {
        currentUser = id;
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('user-display').innerText = `你好, ${name}`;
        document.getElementById('teacher-ops').style.display = role === 't' ? 'block' : 'none';
        document.getElementById('student-ops').style.display = role === 's' ? 'block' : 'none';
        if(role === 's') renderStudentReport();
        if(role === 't') refreshGradeTable();
        nav('home', document.querySelector('.nav-btn'));
    }

    /* [33] 教師輸入核心 (同步到 LOCALSTORAGE) */
    function refreshGradeTable() {
        const cls = document.getElementById('grade-cls-sel').value;
        const sub = document.getElementById('grade-sub-sel').value;
        const body = document.getElementById('grade-list');
        body.innerHTML = "";
        for(let i=1; i<=45; i++) {
            let sid = `114-114${cls}${i.toString().padStart(2, '0')}`;
            let data = (GLOBAL_DB.scores[cls] && GLOBAL_DB.scores[cls][sub]) ? GLOBAL_DB.scores[cls][sub][sid] : {p:0, s:0, c:""};
            body.innerHTML += `<tr>
                <td>${i}</td><td>學生_${i}</td>
                <td><input type="number" class="p-val" value="${data.p}" oninput="sync(${i-1})"></td>
                <td><input type="number" class="s-val" value="${data.s}" oninput="sync(${i-1})"></td>
                <td id="tot-${i-1}">0</td><td id="lv-${i-1}">丁</td>
                <td><input type="text" class="c-val" value="${data.c || ''}" placeholder="評語"></td>
            </tr>`;
            sync(i-1);
        }
    }

    function sync(idx) {
        const p = parseFloat(document.querySelectorAll('.p-val')[idx].value) || 0;
        const s = parseFloat(document.querySelectorAll('.s-val')[idx].value) || 0;
        const tot = Math.round(p*0.6 + s*0.4);
        const cell = document.getElementById(`tot-${idx}`);
        cell.innerText = tot;
        cell.className = tot < 60 ? "fail" : "";
        let lv = tot >= 90 ? "優" : tot >= 80 ? "甲" : tot >= 70 ? "乙" : tot >= 60 ? "丙" : "丁";
        document.getElementById(`lv-${idx}`).innerText = lv;
    }

    function saveData() {
        const cls = document.getElementById('grade-cls-sel').value;
        const sub = document.getElementById('grade-sub-sel').value;
        if(!GLOBAL_DB.scores[cls]) GLOBAL_DB.scores[cls] = {};
        if(!GLOBAL_DB.scores[cls][sub]) GLOBAL_DB.scores[cls][sub] = {};
        
        document.querySelectorAll('#grade-list tr').forEach((tr, i) => {
            let sid = `114-114${cls}${(i+1).toString().padStart(2, '0')}`;
            GLOBAL_DB.scores[cls][sub][sid] = {
                p: document.querySelectorAll('.p-val')[i].value,
                s: document.querySelectorAll('.s-val')[i].value,
                c: document.querySelectorAll('.c-val')[i].value
            };
        });
        localStorage.setItem('TM_DB', JSON.stringify(GLOBAL_DB));
        alert("成績已儲存並同步到全校雲端！");
    }

    /* [21] 學生端：同步讀取教師輸入的成績 */
    function renderStudentReport() {
        const body = document.getElementById('stu-report-body');
        body.innerHTML = "";
        const cls = currentUser.substring(8, 10);
        const subjects = ["國文", "英文", "數學", "自然科學", "地理", "歷史"];
        
        subjects.forEach(sub => {
            let d = (GLOBAL_DB.scores[cls] && GLOBAL_DB.scores[cls][sub]) ? GLOBAL_DB.scores[cls][sub][currentUser] : {p:0, s:0};
            let tot = Math.round(d.p*0.6 + d.s*0.4);
            let lv = tot >= 90 ? "優" : tot >= 80 ? "甲" : tot >= 70 ? "乙" : tot >= 60 ? "丙" : "丁";
            body.innerHTML += `<tr>
                <td>${sub}</td><td>${d.p}</td><td>${d.s}</td>
                <td class="${tot < 60 ? 'fail' : ''}">${tot}</td><td>${lv}</td><td>-</td>
            </tr>`;
        });
    }

    function nav(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
        document.getElementById('view-' + id).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
</body>
</html>
