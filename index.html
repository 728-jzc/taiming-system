<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>TM-OS V5.12.0 | 台明中學終極雲端版</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <style>
        :root { --p: #002d55; --a: #0078d4; --s: #107c10; --d: #d13438; --bg: #f4f7f9; }
        body { margin: 0; display: flex; height: 100vh; font-family: "Microsoft JhengHei"; background: var(--bg); }
        
        /* 按鈕反饋 */
        button { cursor: pointer; border: none; border-radius: 5px; transition: 0.1s; }
        button:active { transform: scale(0.95); filter: brightness(0.8); }
        
        aside { width: 250px; background: var(--p); color: white; display: flex; flex-direction: column; }
        .nav-btn { padding: 15px 20px; cursor: pointer; border-left: 5px solid transparent; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); }
        .nav-btn.active { background: rgba(255,255,255,0.2); border-left-color: #00dcff; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 60px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .page { display: none; padding: 25px; height: 100%; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        .fail { color: var(--d); font-weight: bold; } /* 不及格紅字 */
        
        #gate { position: fixed; inset: 0; background: #001529; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; }
    </style>
</head>
<body>

<div id="gate">
    <h2>TM-OS V5.12.0 系統安全解鎖</h2>
    <input type="password" id="sys-pin" placeholder="PIN 碼" style="padding:10px; font-size:20px; text-align:center; border-radius:5px;">
    <button onclick="unlock()" style="margin-top:20px; padding:10px 40px; background:var(--a); color:white;">解鎖</button>
</div>

<aside id="sidebar" style="display:none;">
    <div style="padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <h3>台明中學管理</h3>
        <div id="sem-tag" style="font-size:12px; color:#00dcff;"></div>
    </div>
    <div class="nav-btn active" onclick="showP('home')">🏠 系統首頁</div>
    <div class="nav-btn" onclick="showP('cal')">📅 學校行事曆</div>
    <div class="nav-btn" onclick="showP('tt')">📖 班級課表</div>
    
    <div id="teacher-menu" style="display:none;">
        <div class="nav-btn" onclick="showP('gt')">✍️ 成績錄取 (22科)</div>
        <div class="nav-btn" onclick="showP('dt')">⚖️ 學生獎懲提報</div>
        <div class="nav-btn" onclick="showP('up')">📁 PDF 檔案上傳</div>
    </div>
</aside>

<main id="main-ui" style="display:none;">
    <header>
        <div id="clock"></div>
        <div id="login-btns">
            <button onclick="openL('t')" style="background:var(--p); color:white; padding:8px 15px;">教師登入</button>
            <button onclick="openL('s')" style="background:#666; color:white; padding:8px 15px;">學生登入</button>
        </div>
    </header>

    <div id="p-gt" class="page">
        <h2>成績錄取系統</h2>
        <div class="card">
            年級：<select id="sel-g"></select> 班級：<select id="sel-c"></select>
            科目：<select id="sel-sub"></select> 階段：<select id="sel-ex"></select>
            <button onclick="makeList()" style="background:var(--a); color:white; padding:5px 15px;">載入名單</button>
        </div>
        <div id="lock-msg"></div>
        <div class="card">
            <table id="g-table">
                <thead><tr><th>座號</th><th>學號</th><th>平時(60%)</th><th>段考(40%)</th><th>總計</th><th>等第</th></tr></thead>
                <tbody id="g-body"></tbody>
            </table>
            <button id="btn-save" onclick="saveData()" style="width:100%; padding:15px; background:var(--s); color:white; margin-top:20px; display:none;">💾 儲存該科成績並同步至雲端</button>
        </div>
    </div>

    <div id="p-up" class="page">
        <h2>📁 PDF 檔案上傳中心</h2>
        <div class="card">
            上傳類別：<select id="up-type"><option value="tt">課表</option><option value="cal">行事曆</option></select>
            年級：<select id="up-g"></select> 班級：<select id="up-c"></select>
            <input type="file" id="up-file" accept="application/pdf" style="margin-top:20px; display:block;">
            <button onclick="startUpload()" style="margin-top:20px; background:var(--a); color:white; padding:10px 30px;">開始上傳並同步</button>
        </div>
    </div>
</main>

<script>
// Firebase 初始化
const firebaseConfig = {
    apiKey: "AIzaSyDX-nyOejNrcdX1HXdSX988ho1aIcYZVKA",
    authDomain: "taimingsystem.firebaseapp.com",
    databaseURL: "https://taimingsystem-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "taimingsystem",
    storageBucket: "taimingsystem.firebasestorage.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

const SUB_LIST = ["國語文","本土語文","英語文","數學","歷史","地理","公民","物理","化學","生物","地球科學","音樂","視覺藝術","表演藝術","家政","童軍","輔導活動","生活科技","資訊科技","健康教育","體育"];

function unlock() {
    if(document.getElementById('sys-pin').value === '1234') {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('sidebar').style.display = 'flex';
        document.getElementById('main-ui').style.display = 'flex';
        setup();
    }
}

function setup() {
    // 初始化下拉選單
    const g = [document.getElementById('sel-g'), document.getElementById('up-g')];
    const c = [document.getElementById('sel-c'), document.getElementById('up-c')];
    g.forEach(s => [7,8,9].forEach(n => s.add(new Option(n+'年級', n))));
    c.forEach(s => { for(let i=1; i<=28; i++) s.add(new Option(i+'班', i.toString().padStart(2,'0'))); });
    SUB_LIST.forEach(sub => document.getElementById('sel-sub').add(new Option(sub, sub)));
    [1,2,3].forEach(ex => document.getElementById('sel-ex').add(new Option('第'+ex+'階段', ex)));
    updateTick();
}

function updateTick() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleString();
    const sem = (now.getMonth()+1 >= 8 || now.getMonth()+1 <= 1) ? 1 : 2;
    document.getElementById('sem-tag').innerText = `114學年度 第${sem}學期`;
}

function makeList() {
    const g = document.getElementById('sel-g').value;
    const c = document.getElementById('sel-c').value;
    const base = {7:114, 8:113, 9:112}[g];
    let html = '';
    for(let i=1; i<=24; i++) {
        const sno = i.toString().padStart(2, '0');
        const sid = (i === 24) ? `${base}-${base}${c}24` : `${base}-${base}${c}${sno}`;
        html += `<tr><td>${sno}</td><td id="sid-${i}">${sid}</td>
            <td><input type="number" id="p-${i}" oninput="calc(${i})" style="width:50px;"></td>
            <td><input type="number" id="e-${i}" oninput="calc(${i})" style="width:50px;"></td>
            <td id="t-${i}">-</td><td id="r-${i}">-</td></tr>`;
    }
    document.getElementById('g-body').innerHTML = html;
    document.getElementById('btn-save').style.display = 'block';
}

function calc(i) {
    const p = parseFloat(document.getElementById(`p-${i}`).value) || 0;
    const e = parseFloat(document.getElementById(`e-${i}`).value) || 0;
    const score = Math.round(p * 0.6 + e * 0.4);
    const cellT = document.getElementById(`t-${i}`);
    cellT.innerText = score;
    cellT.className = score < 60 ? 'fail' : '';
    let rank = score >= 90 ? '優' : score >= 80 ? '甲' : score >= 70 ? '乙' : score >= 60 ? '丙' : '丁';
    document.getElementById(`r-${i}`).innerText = rank;
}

function saveData() {
    const g = document.getElementById('sel-g').value, c = document.getElementById('sel-c').value;
    const sub = document.getElementById('sel-sub').value, ex = document.getElementById('sel-ex').value;
    let data = {};
    for(let i=1; i<=24; i++) {
        const sid = document.getElementById(`sid-${i}`).innerText;
        data[`/grades/${g}-${c}/${sid}/${sub}/ex${ex}`] = { 
            p: document.getElementById(`p-${i}`).value, 
            e: document.getElementById(`e-${i}`).value 
        };
    }
    db.ref().update(data).then(() => alert('✅ 雲端同步成功！數據已永久保存。'));
}

function startUpload() {
    const file = document.getElementById('up-file').files[0];
    if(!file) return alert('請選取 PDF');
    const type = document.getElementById('up-type').value;
    const path = `school_files/${type}_${Date.now()}.pdf`;
    storage.ref(path).put(file).then(() => alert('✅ PDF 上傳成功，已同步至全校裝置。'));
}

function showP(id) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById('p-' + id).style.display = 'block';
}

setInterval(updateTick, 1000);
</script>
</body>
</html>
