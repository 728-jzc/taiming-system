<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台明中學智慧校務雲端系統 v10.0 | TM-ERP Enterprise</title>
    <style>
        /* [0001-0500 Lines] 核心樣式表與動態 UI 設計 */
        :root {
            --tm-primary: #1e293b; --tm-secondary: #334155; --tm-accent: #0ea5e9;
            --tm-success: #10b981; --tm-danger: #ef4444; --tm-warning: #f59e0b;
            --tm-bg: #f8fafc; --tm-glass: rgba(255, 255, 255, 0.9);
        }

        body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--tm-bg); color: var(--tm-primary); display: flex; height: 100vh; overflow: hidden; }

        /* 大型側邊導航系統 */
        #tm-sidebar { width: 280px; background: var(--tm-primary); color: white; display: flex; flex-direction: column; box-shadow: 4px 0 20px rgba(0,0,0,0.1); z-index: 100; }
        .sidebar-header { padding: 40px 25px; background: #0f172a; border-bottom: 1px solid #1e293b; }
        .nav-section { flex: 1; overflow-y: auto; padding: 20px 0; }
        .nav-label { padding: 10px 25px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; }
        .nav-item { width: 100%; padding: 14px 25px; border: none; background: none; color: #94a3b8; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .nav-item:hover { background: rgba(14, 165, 233, 0.1); color: var(--tm-accent); }
        .nav-item.active { background: var(--tm-accent); color: white; border-right: 5px solid white; }

        /* 門禁系統 - 高階磨砂效果 */
        #tm-lockscreen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .lock-card { background: var(--tm-glass); backdrop-filter: blur(25px); padding: 60px; border-radius: 40px; text-align: center; width: 450px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5); }
        .pin-input { font-size: 48px; width: 200px; text-align: center; border: none; background: transparent; color: var(--tm-accent); border-bottom: 4px solid var(--tm-accent); outline: none; letter-spacing: 12px; margin: 30px 0; font-weight: bold; }

        /* 表格與課表樣式 */
        .tm-container { padding: 40px; overflow-y: auto; height: 100%; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .timetable-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; }
        .timetable-table th { background: #f1f5f9; padding: 20px; font-weight: 600; border-bottom: 2px solid #e2e8f0; text-align: center; }
        .timetable-table td { padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        .subject-cell { min-height: 80px; display: flex; flex-direction: column; justify-content: center; border-radius: 10px; border: 1px dashed #e2e8f0; }
        .subject-title { font-weight: bold; color: var(--tm-primary); }
        .teacher-tag { font-size: 11px; color: var(--tm-accent); margin-top: 5px; }
        .break-cell { background: #fffbeb; font-weight: bold; color: #92400e; font-size: 13px; }

        /* 隱藏元素邏輯 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="tm-lockscreen">
        <div class="lock-card">
            <h1 style="color:#0f172a; margin:0;">TAIMING ERP</h1>
            <p style="color:#64748b;">請輸入管理 PIN 以喚醒雲端主機</p>
            <input type="password" id="pin-entry" class="pin-input" maxlength="4" autofocus>
            <button onclick="bootSystem()" class="btn-primary" style="width:100%; background:var(--tm-accent); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; cursor:pointer;">啟動主機</button>
        </div>
    </div>

    <aside id="tm-sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; font-size:22px;">智慧台明 v10.0</h2>
            <div style="font-size:10px; color:#64748b; margin-top:5px;">ENTERPRISE CLOUD SERVER</div>
        </div>
        <div class="nav-section">
            <div class="nav-label">核心監控</div>
            <button class="nav-item active" onclick="navTo('dash')">🏠 系統首頁儀表板</button>
            <button class="nav-item" onclick="navTo('tt')">📅 114學年度精確課表</button>
            
            <div id="stu-menu" class="hidden">
                <div class="nav-label">學生專區</div>
                <button class="nav-item" onclick="navTo('my-grade')">📊 查看我的學期成績單</button>
                <button class="nav-item">📚 數位學習資源庫</button>
            </div>

            <div id="tea-menu" class="hidden">
                <div class="nav-label">教務管理</div>
                <button class="nav-item" onclick="navTo('input')">✍️ 班級成績評量輸入</button>
                <button class="nav-item" onclick="navTo('report')">📥 下載及格/不及格名單</button>
                <button class="nav-item">⚙️ 系統日誌監查</button>
            </div>
        </div>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <header style="height:80px; background:white; display:flex; justify-content:space-between; align-items:center; padding:0 40px; border-bottom:1px solid #e2e8f0;">
            <div style="font-weight:bold; font-size:18px;" id="view-title">系統儀表板</div>
            <div id="user-control">
                <button onclick="openLogin()" id="login-trigger" style="background:var(--tm-primary); color:white; border:none; padding:10px 25px; border-radius:10px; cursor:pointer;">🔐 身份驗證登入</button>
                <div id="user-info" class="hidden">
                    <span id="user-display" style="font-weight:bold; color:var(--tm-accent);"></span>
                    <button onclick="location.reload()" style="background:none; border:none; color:var(--tm-danger); cursor:pointer; margin-left:15px;">[登出]</button>
                </div>
            </div>
        </header>

        <div class="tm-container">
            <div id="page-dash" class="view">
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px;">
                    <div class="card"><h5>全校學生數</h5><h2>2,150 名</h2></div>
                    <div class="card"><h5>當前學期</h5><h2>114-2期</h2></div>
                    <div class="card"><h5>伺服器負載</h5><h2 style="color:var(--tm-success)">3.4% OK</h2></div>
                    <div class="card"><h5>待辦事項</h5><h2 style="color:var(--tm-warning)">0 件</h2></div>
                </div>
            </div>

            <div id="page-tt" class="view hidden">
                <div class="card">
                    <h3>114學年度第2學期 7年28班 班級課表</h3>
                    <table class="timetable-table">
                        <thead>
                            <tr><th>時間/節次</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>
                        </thead>
                        <tbody id="tt-body">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="page-my-grade" class="view hidden">
                <div class="card">
                    <h2 id="stu-name-tag"></h2>
                    <table class="timetable-table">
                        <thead><tr><th>科目</th><th>平時平均</th><th>二段成績</th><th>學期總分</th><th>等第</th></tr></thead>
                        <tbody>
                            <tr><td>國文</td><td>88</td><td>92</td><td>90</td><td>優</td></tr>
                            <tr><td>數學</td><td>72</td><td>65</td><td>69</td><td>丙</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="tm-login-modal" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:10000; display:flex; justify-content:center; align-items:center;">
        <div class="lock-card" style="width:400px; padding:40px;">
            <h3>使用者身分驗證</h3>
            <select id="login-role" class="pin-input" style="font-size:18px; width:100%; letter-spacing:normal;">
                <option value="student">學生 (輸入姓名)</option>
                <option value="teacher">教師 (Jason1010907)</option>
            </select>
            <input type="text" id="login-id" placeholder="帳號 / 姓名" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
            <input type="password" id="login-pw" placeholder="密碼" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
            <button onclick="performAuth()" class="btn-primary" style="width:100%; padding:15px; background:var(--tm-accent); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">核對憑證</button>
            <button onclick="closeLogin()" style="background:none; border:none; color:#64748b; margin-top:15px; cursor:pointer;">取消</button>
        </div>
    </div>

<script>
    /* [0501-10000 Lines] 系統核心控制邏輯與大型資料庫 */

    const DATABASE = {
        // 匯入 PDF 全校班級名單
        classes: {
            "701": ["蔡家凱","簡子凱","邱翔翰","郭承恩","陳郁騰","蘇宇凱","陳柏珮","郭思珮","蔡雅翰","何翔恩","蘇柏瑋","劉宏翔","賴宏睿","簡怡睿","李冠翔","蘇翔雯","蘇志恩","吳信瑜","張宏恩","楊俊瑜","張子凱","李子維","蘇思瑜","周哲庭","楊承柔","賴書庭"],
            "726": ["何志睿","陳家恩","何郁潔","楊承綸","曾郁翔","郭雅翰","周宇榆","楊宏維","邱思彤","陳怡翔","蔡昱萱","曾俊恩","何雅綸","許昱騰","曾書彤","劉郁萱","邱昀翰","簡昱榆","蘇柏瑄","蔡宗萱","賴子維","何家恩","曾信翰","張家騰"],
            "728": ["林承綸","陳思綸","國世並","洪昱辰","吳信榆","林書騰","吳郁庭","何雅維","許承珮","洪雅翰","劉雅彤","曾文釋","陳哲翰","蘇子瑄","陳郁辰","鄭宏翰","蔡柏庭","簡品倫","吳書萱","周品瑄","何宏彤","簡宏柔","鄭思茹","陳哲珮"]
        },
        // 匯入 728 課表 (精確至任課老師)
        tt728: [
            { time: "07:50~08:35", d: ["國文<br>廖健哲", "體育<br>廖柯智", "生物<br>揮方無", "體育<br>廖柯智", "公民<br>國第一"] },
            { time: "08:35~08:45", d: ["下課休息"], type: "break" },
            { time: "08:45~09:30", d: ["數學<br>慧芳珍", "英文<br>又蔫新", "國文<br>廖健哲", "數學<br>慧芳珍", "生物<br>揮方無"] },
            { time: "09:30~09:40", d: ["下課休息"], type: "break" },
            { time: "09:40~10:35", d: ["地理<br>蔡逸芬", "輔導<br>廖填", "國文<br>廖健哲", "視覺藝術", "聽覺藝術"] },
            { time: "10:35~10:45", d: ["下課休息"], type: "break" },
            { time: "10:45~11:50", d: ["歷史<br>董自如", "數學<br>慧芳珍", "數學<br>慧芳珍", "國文<br>廖健哲", "數學<br>慧芳珍"] },
            { time: "11:50~12:50", d: ["午休/用餐時間"], type: "break" },
            { time: "13:00~13:45", d: ["公民<br>國第一", "表演藝術", "資訊<br>吳建如", "英文<br>又蔫新", "國文<br>廖健哲"] },
            { time: "13:50~14:35", d: ["生物<br>揮方無", "英文<br>又蔫新", "健教<br>賴湘茹", "童軍<br>賴建淑", "英文<br>又蔫新"] }
        ]
    };

    let currentUser = null;

    function bootSystem() {
        if(document.getElementById('pin-entry').value === "1234") {
            document.getElementById('tm-lockscreen').style.opacity = '0';
            setTimeout(() => document.getElementById('tm-lockscreen').style.display = 'none', 800);
            renderTimetable();
        } else { alert("PIN 錯誤，系統鎖定"); }
    }

    function renderTimetable() {
        const body = document.getElementById('tt-body');
        body.innerHTML = "";
        DATABASE.tt728.forEach(row => {
            const tr = document.createElement('tr');
            if(row.type === "break") {
                tr.innerHTML = `<td colspan="6" class="break-cell">${row.time} | ${row.d[0]}</td>`;
            } else {
                let html = `<td><b>${row.time}</b></td>`;
                row.d.forEach(cell => {
                    html += `<td><div class="subject-cell"><span class="subject-title">${cell}</span></div></td>`;
                });
                tr.innerHTML = html;
            }
            body.appendChild(tr);
        });
    }

    function openLogin() { document.getElementById('tm-login-modal').classList.remove('hidden'); }
    function closeLogin() { document.getElementById('tm-login-modal').classList.add('hidden'); }

    function performAuth() {
        const role = document.getElementById('login-role').value;
        const id = document.getElementById('login-id').value;

        if(role === 'teacher') {
            if(id === "Jason1010907") {
                currentUser = { name: "Jason 老師", role: "teacher" };
                document.getElementById('tea-menu').classList.remove('hidden');
            } else { alert("教師帳號不存在"); return; }
        } else {
            let isStudent = false;
            for(let c in DATABASE.classes) {
                if(DATABASE.classes[c].includes(id)) { isStudent = true; break; }
            }
            if(isStudent) {
                currentUser = { name: id, role: "student" };
                document.getElementById('stu-menu').classList.remove('hidden');
                document.getElementById('stu-name-tag').innerText = id + " 同學 的個人成績單";
            } else { alert("查無此學生名冊"); return; }
        }

        document.getElementById('login-trigger').classList.add('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('user-display').innerText = currentUser.name;
        closeLogin();
        navTo('dash');
    }

    function navTo(page) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        document.getElementById('page-' + page).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('view-title').innerText = event.currentTarget.innerText;
    }
</script>
</body>
</html>
